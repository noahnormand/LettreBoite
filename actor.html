<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LettreBoite - Acteur</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-film"></i>
            </a>
            <nav class="nav-links" id="nav-links">
                <ul>
                    <li><a href="index.html">Films</a></li>
                    <li><a href="#">Séries</a></li>
                    <li><a href="#">Populaires</a></li>
                </ul>
            </nav>
            <button class="hamburger" id="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <main id="actor-details">
        <section class="actor-banner">
            <div class="banner-overlay"></div>
            <div class="actor-banner-content">
                <div class="actor-photo-container" id="actor-photo"></div>
                <div class="actor-info-container">
                    <h1 class="title" id="actor-name"></h1>
                    <div class="actor-meta">
                        <p id="actor-birthday"></p>
                        <p id="actor-birthplace"></p>
                        <p id="actor-known-for"></p>
                    </div>
                    <div class="synopsis-section">
                        <h3>Biographie</h3>
                        <p class="overview" id="actor-biography"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="media-section">
            <div class="section-header">
                <h2>Filmographie</h2>
            </div>
            <div class="cards-grid" id="actor-credits-grid"></div>
        </section>
    </main>

    <footer class="footer"></footer>

    <script src="js/TMDBApi.js"></script>
    <script src="js/Affichage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
