<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Projet Film LettreBoite - Accueil</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
    <div class="navbar-content">
        <a class="logo" href="index.html">
            <i class="fa-solid fa-film"></i>
        </a>
        <nav class="nav-links" id="nav-links">
            <ul>
                <li><a href="#movies-section">Films</a></li>
                <li><a href="#series-section">Séries</a></li>
                <li><a href="#trending-section">Populaires</a></li>
            </ul>
        </nav>
        <button class="hamburger" id="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
</header>

<main>

    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2>Bienvenue.</h2>
            <p>Des millions de films, séries télévisées et personnalités. Explorez maintenant.</p>

            <div class="search-box">
                <input id="search-input" placeholder="Rechercher un film, une série, un acteur..." type="text">
                <button id="search-btn">Rechercher</button>
            </div>
        </div>
    </section>


    <section class="media-section" id="favorites-section" style="display:none;">
        <div class="section-header">
            <h2><i class="fa-solid fa-heart" style="color:#e74c3c;margin-right:8px;"></i>Mes favoris</h2>
        </div>
        <div class="cards-grid" id="favorites-grid"></div>
    </section>

    <section class="media-section" id="trending-section">
        <div class="section-header">
            <h2>Tendances</h2>
            <div class="toggle-group">
                <button class="toggle-btn active" data-filter="day">Aujourd'hui</button>
                <button class="toggle-btn" data-filter="week">Cette semaine</button>
            </div>
        </div>

        <div class="cards-grid" id="trending-grid"></div>
    </section>

    <section class="media-section" id="series-section">
        <div class="section-header">
            <h2>Séries</h2>
            <div class="toggle-group filter-group">
                <button class="toggle-btn active" data-type="series" data-filter="popular">Populaire</button>
                <button class="toggle-btn" data-type="series" data-filter="top_rated">Mieux notées</button>
            </div>
        </div>
        <div class="cards-grid" id="series-grid"></div>
    </section>

    <section class="media-section" id="movies-section">
        <div class="section-header">
            <h2>Films</h2>
            <div class="toggle-group filter-group">
                <button class="toggle-btn active" data-type="movies" data-filter="popular">Populaire</button>
                <button class="toggle-btn" data-type="movies" data-filter="top_rated">Mieux notés</button>
            </div>
        </div>
        <div class="cards-grid" id="movies-grid"></div>
    </section>

</main>

<footer class="footer"></footer>

<script src="js/TMDBApi.js"></script>
<script src="js/Affichage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
