<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LettreBoite - Détails</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-film"></i>
            </a>
            <nav class="nav-links" id="nav-links">
                <ul>
                    <li><a href="index.html">Films</a></li>
                    <li><a href="#">Séries</a></li>
                    <li><a href="#">Populaires</a></li>
                </ul>
            </nav>
            <button class="hamburger" id="nav-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <main>
        <article class="focus-article" id="media-details">
            <section class="focus-banner">
                <div class="banner-overlay"></div>
                <div class="banner-content">
                    <div class="poster-container" id="media-poster"></div>
                    <div class="info-container">
                        <h1 class="title" id="media-title"></h1>
                        <div class="meta-data">
                            <div class="rating-badge large-badge" id="media-rating"></div>
                            <span class="release-date" id="media-release-date"></span>
                            <span class="genres" id="media-genres"></span>
                            <span class="runtime" id="media-runtime"></span>
                        </div>
                        <div class="synopsis-section">
                            <h2>Synopsis</h2>
                            <p class="overview" id="media-overview"></p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="media-section trailer-section" id="trailer-container"></section>

            <section class="media-section cast-section">
                <div class="section-header">
                    <h2>Casting (Têtes d'affiche)</h2>
                </div>
                <div class="cards-grid cast-grid" id="cast-grid"></div>
            </section>
        </article>
    </main>

    <footer class="footer"></footer>

    <script src="js/TMDBApi.js"></script>
    <script src="js/Affichage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
